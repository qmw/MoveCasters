<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MoveCasters</title>
<meta name="description" content="A tactical roguelite where your deck is the dungeon floor. Step on a spell to cast it.">
<meta name="theme-color" content="#120d18">
<link rel="icon" href="assets/0x72/frames/wizzard_m_idle_anim_f0.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- TITLE -->
  <section id="scr-title" class="screen">
    <div class="title-art"><img id="title-img" alt=""></div>
    <h1 class="logo">MOVE<span>CASTERS</span></h1>
    <p class="tag">Your deck is the dungeon floor. Step on a spell to cast it.</p>
    <div class="menu">
      <button id="btn-continue" class="btn big hidden">Continue run</button>
      <button id="btn-new" class="btn big primary">Descend</button>
      <button id="btn-daily" class="btn">Daily Descent</button>
      <button id="btn-sanctum" class="btn">Sanctum <span id="ember-count" class="ember"></span></button>
      <button id="btn-codex" class="btn">Codex</button>
      <button id="btn-help" class="btn ghost">How to play</button>
    </div>
    <div id="title-goals" class="goals"></div>
    <footer class="credits">Art: 0x72 DungeonTileset II (CC0) · Codex-generated icons · <a href="https://github.com/qmw/MoveCasters" target="_blank" rel="noopener">source</a></footer>
  </section>

  <!-- CLASS SELECT -->
  <section id="scr-class" class="screen hidden">
    <header class="bar"><button class="btn ghost back" data-go="title">◀ Back</button><h2>Choose your caster</h2><span></span></header>
    <div id="class-list" class="class-list"></div>
    <div id="class-detail" class="class-detail"></div>
  </section>

  <!-- GAME -->
  <section id="scr-game" class="screen hidden">
    <div id="hud" class="hud">
      <div class="hud-left"><div id="hearts" class="hearts"></div><div id="block" class="blockv"></div></div>
      <div class="hud-mid"><div id="floor-name"></div><div id="turns"></div></div>
      <div class="hud-right"><div id="relics" class="relics"></div><button id="btn-menu" class="btn icon" title="Menu">☰</button></div>
    </div>
    <div id="bossbar" class="bossbar hidden"><span id="boss-name"></span><div class="bb"><div id="boss-fill"></div></div></div>
    <div class="play-area">
      <div id="board-wrap" class="board-wrap"><canvas id="board"></canvas><div id="banner" class="banner"></div><div id="toast" class="toast hidden"></div></div>
      <aside class="side">
        <div id="deck" class="deck"></div>
        <div id="info" class="info"></div>
        <div class="controls">
          <button id="btn-wait" class="btn">Wait <kbd>Space</kbd></button>
          <button id="btn-danger" class="btn ghost" title="Toggle threat overlay (T)">Threats</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- SANCTUM -->
  <section id="scr-sanctum" class="screen hidden">
    <header class="bar"><button class="btn ghost back" data-go="title">◀ Back</button><h2>The Sanctum</h2><span class="ember big" id="sanctum-embers"></span></header>
    <nav class="tabs" id="sanctum-tabs"></nav>
    <div id="sanctum-body" class="sanctum-body"></div>
  </section>

  <!-- CODEX -->
  <section id="scr-codex" class="screen hidden">
    <header class="bar"><button class="btn ghost back" data-go="title">◀ Back</button><h2>Codex</h2><span id="codex-pct"></span></header>
    <nav class="tabs" id="codex-tabs"></nav>
    <div id="codex-body" class="codex-body"></div>
  </section>

  <!-- MODAL -->
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
</div>
<script type="module" src="src/ui/main.js"></script>
</body>
</html>
